[package]
name = "tend"
version = "0.1.0"
edition = "2021"
description = "A small process supervisor: starts services in dependency order, waits until they are ready, restarts failures with backoff, captures and rotates logs, and stops everything in reverse order."
license = "MIT"

[lib]
name = "tend"

[[bin]]
name = "tend"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
getrandom = "0.3"
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false
